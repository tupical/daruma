name: Audit imports

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit-grep:
    name: Core must not depend on apps/*
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guards catch fixture violations
        shell: bash
        run: bash scripts/audit-imports.test.sh

      - name: Grep for forbidden app imports
        shell: bash
        run: bash scripts/audit-imports.sh core

      - name: Embed-mode clients reach for runtime only via daruma_core::embed
        shell: bash
        run: bash scripts/audit-imports.sh embed
